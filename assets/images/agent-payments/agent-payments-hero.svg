<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">결제 기록과 위임 기록</title>
  <desc id="desc">영수증은 금액과 판매자를, 위임서는 목적과 한도와 조건을 기록한다. 돈이 정확히 전달됐는지와 사용자의 뜻을 지켰는지는 각각 확인해야 한다.</desc>
  <style>
    text { font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #173047; }
    .title { font-size: 40px; font-weight: 700; }
    .label { font-size: 34px; font-weight: 700; }
    .detail { font-size: 28px; font-weight: 500; }
    .small { font-size: 25px; }
  </style>
  <rect width="800" height="520" rx="28" fill="#f5f3ee"/>
  <path d="M0 428 Q260 375 800 445 V520 H0Z" fill="#ebe8df"/>
  <text class="title" x="400" y="72" text-anchor="middle">결제 기록과 위임 기록</text>
  <text class="small" x="400" y="115" text-anchor="middle" fill="#496071">돈의 이동과 의도의 실행을 함께 살펴보기</text>

  <rect x="42" y="156" width="340" height="304" rx="24" fill="#d9ded6"/>
