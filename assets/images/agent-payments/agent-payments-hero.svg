  <text class="label" x="208" y="329" text-anchor="middle">금액 · 판매자</text>
  <text class="label" x="589" y="329" text-anchor="middle">목적 · 한도 · 조건</text>
  <text class="detail" x="208" y="380" text-anchor="middle">돈이 정확히 갔는가?</text>
  <text class="detail" x="589" y="380" text-anchor="middle">사용자의 뜻을 지켰는가?</text>
  <path d="M111 411 H304" stroke="#a4c5b2" stroke-width="2"/>
  <path d="M492 411 H685" stroke="#c4b5d8" stroke-width="2"/>
