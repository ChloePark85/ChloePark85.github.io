<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1440" viewBox="0 0 640 1440" role="img" aria-labelledby="title desc">
  <title id="title">에이전트 권한 위임과 결제 및 복구 요청 흐름</title>
  <desc id="desc">목적과 조건을 합의하고 실행 시스템이 거래와 작업 전체의 한도를 확인한다. 조건이 그대로면 실행하고, 변경되면 멈추고 다시 동의를 받은 뒤 한도를 재확인한다. 실행 뒤 구매와 작업 결과를 확인한다. 문제가 생기면 에이전트를 중지하고 권한을 회수하며 취소와 환불을 요청한 뒤 처리 결과를 확인한다. 환불 가능 여부와 완료는 별도로 확인해야 한다.</desc>
  <style>
    text { font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #173047; }
    .title { font-size: 36px; font-weight: 700; }
    .label { font-size: 31px; font-weight: 700; }
    .detail { font-size: 25px; }
    .branch { font-size: 26px; font-weight: 600; }
    .number { font-size: 26px; font-weight: 700; fill: #fff; }
    .small { font-size: 23px; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#547181"/></marker>
    <marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#705298"/></marker>
  </defs>
  <rect width="640" height="1440" rx="24" fill="#f5f3ee"/>
  <text class="title" x="320" y="57" text-anchor="middle">돈을 맡기는 흐름</text>
  <text class="detail" x="320" y="99" text-anchor="middle">위임 · 실행 · 사고 이후의 복구</text>

  <rect x="32" y="133" width="576" height="125" rx="19" fill="#fff" stroke="#c8d4d8" stroke-width="2"/>
  <circle cx="70" cy="172" r="22" fill="#245c71"/><text class="number" x="70" y="181" text-anchor="middle">1</text>
  <text class="label" x="108" y="184">목적과 허용 조건 합의</text>
  <text class="detail" x="60" y="230">예산의 범위 · 판매자 · 취소 조건</text>
  <path d="M320 260V295" stroke="#547181" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="32" y="305" width="576" height="125" rx="19" fill="#fff" stroke="#c8d4d8" stroke-width="2"/>
  <circle cx="70" cy="344" r="22" fill="#245c71"/><text class="number" x="70" y="353" text-anchor="middle">2</text>
  <text class="label" x="108" y="356">실행 시스템이 한도 확인</text>
  <text class="detail" x="60" y="402">거래별 한도와 작업 전체 한도 적용</text>
  <path d="M320 432V465" stroke="#547181" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="32" y="477" width="576" height="128" rx="19" fill="#e9edf5" stroke="#b7c5d9" stroke-width="2"/>
  <circle cx="70" cy="516" r="22" fill="#245c71"/><text class="number" x="70" y="525" text-anchor="middle">3</text>
  <text class="label" x="108" y="528">조건이 달라졌는가?</text>
  <text class="detail" x="60" y="574">배송비 · 구독 전환 · 환불 조건 등</text>
  <path d="M155 607V790H320" fill="none" stroke="#547181" stroke-width="3"/>
  <rect x="79" y="628" width="152" height="42" rx="21" fill="#e2f0e8"/><text class="branch" x="155" y="657" text-anchor="middle">변경 없음</text>
  <path d="M472 607V689" fill="none" stroke="#705298" stroke-width="3" marker-end="url(#purple-arrow)"/>
  <rect x="396" y="628" width="152" height="42" rx="21" fill="#ebe6f5"/><text class="branch" x="472" y="657" text-anchor="middle">변경 있음</text>
  <rect x="333" y="700" width="278" height="90" rx="16" fill="#ebe6f5" stroke="#c5b8de" stroke-width="2"/>
  <text class="branch" x="472" y="738" text-anchor="middle">멈추고 다시 확인</text>
  <text class="small" x="472" y="770" text-anchor="middle">재동의 후 한도 재확인</text>
  <path d="M472 792V812H320" fill="none" stroke="#705298" stroke-width="3"/>
  <path d="M320 790V828" fill="none" stroke="#547181" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="32" y="840" width="576" height="128" rx="19" fill="#fff" stroke="#c8d4d8" stroke-width="2"/>
  <circle cx="70" cy="879" r="22" fill="#245c71"/><text class="number" x="70" y="888" text-anchor="middle">4</text>
  <text class="label" x="108" y="891">실행과 결과 기록</text>
  <text class="detail" x="60" y="936">구매 내역 · 남은 예산 · 작업 결과</text>
  <path d="M320 970V1050" stroke="#705298" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#purple-arrow)"/>
  <rect x="231" y="984" width="178" height="43" rx="21" fill="#ebe6f5"/><text class="branch" x="320" y="1014" text-anchor="middle">문제가 생기면</text>

  <rect x="32" y="1062" width="576" height="144" rx="19" fill="#ebe6f5" stroke="#c5b8de" stroke-width="2"/>
  <circle cx="70" cy="1101" r="22" fill="#705298"/><text class="number" x="70" y="1110" text-anchor="middle">5</text>
  <text class="label" x="108" y="1113">중지와 복구 요청</text>
  <text class="detail" x="60" y="1153">에이전트 중지 · 남은 권한 회수</text>
  <text class="detail" x="60" y="1189">판매자·서비스에 취소·환불 요청</text>
  <path d="M320 1208V1240" stroke="#547181" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="32" y="1252" width="576" height="105" rx="19" fill="#fff" stroke="#c8d4d8" stroke-width="2"/>
  <text class="label" x="320" y="1295" text-anchor="middle">처리 결과 확인</text>
  <text class="detail" x="320" y="1335" text-anchor="middle">취소·환불 상태 확인 · 미해결 시 문의</text>
  <text class="small" x="320" y="1402" text-anchor="middle">환불 가능 여부와 완료는 별도로 확인해야 한다</text>
</svg>
