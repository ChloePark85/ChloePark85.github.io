# Reading Files
include:
  - _pages
  - robots.txt
  - llms.txt
  - about.txt

# Markdown Processing
markdown               : kramdown
highlighter            : rouge
kramdown:
  input                : GFM
  hard_wrap            : false
  auto_ids             : true
  footnote_nr          : 1
  entity_output        : as_char
  toc_levels           : 1..6
  smart_quotes         : lsquo,rsquo,ldquo,rdquo

# Plugins (GitHub Pages 지원 목록만)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-seo-tag

# Pagination
paginate               : 5
paginate_path          : /page:num/

# Permalinks & Timezone
permalink              : /:categories/:title/
timezone               : Asia/Seoul

# Comments (일단 끔 — 나중에 giscus/Disqus 켤 수 있음)
comments:
  provider             : false

# Archives
category_archive:
  type                 : liquid
  path                 : /categories/
tag_archive:
  type                 : liquid
  path                 : /tags/

# Defaults
defaults:
  # _posts
  - scope:
      path             : ""
      type             : posts
    values:
      layout           : single
      author_profile   : true
      read_time        : true
      comments         : false
      share            : true
      related          : true
      show_date        : true
  # _pages
  - scope:
      path             : "_pages"
      type             : pages
    values:
      layout           : single
      author_profile   : true
