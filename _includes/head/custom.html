<!-- Language and hreflang -->
<html lang="ko">
<link rel="alternate" hreflang="ko" href="{{ page.url | absolute_url }}" />

<!-- Enhanced Open Graph tags -->
<meta property="og:locale" content="ko_KR" />
<meta property="og:site_name" content="Chloe Park · AI 자동화 실험실" />
{% if page.title %}
<meta property="og:title" content="{{ page.title }} · Chloe Park" />
{% else %}
<meta property="og:title" content="Chloe Park · AI 자동화 실험실" />
{% endif %}
{% if page.excerpt %}
<meta property="og:description" content="{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}" />
{% else %}
<meta property="og:description" content="AI 에이전트와 자동화 시스템을 설계합니다. 1인 기업이 AI 팀과 협업하는 워크플로를 실험하고 기록합니다." />
{% endif %}
<meta property="og:url" content="{{ page.url | absolute_url }}" />
<meta property="og:type" content="{% if page.layout == 'single' %}article{% else %}website{% endif %}" />
<meta property="og:image" content="{% if page.header.image %}{{ page.header.image | absolute_url }}{% elsif page.header.teaser %}{{ page.header.teaser | absolute_url }}{% else %}https://github.com/ChloePark85.png{% endif %}" />
{% if page.layout == "single" and page.date %}
<meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}" />
<meta property="article:author" content="박현아" />
{% endif %}

<!-- Twitter Card tags -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:site" content="@chloe_systems" />
<meta name="twitter:creator" content="@chloe_systems" />
{% if page.title %}
<meta name="twitter:title" content="{{ page.title }} · Chloe Park" />
{% else %}
<meta name="twitter:title" content="Chloe Park · AI 자동화 실험실" />
{% endif %}
{% if page.excerpt %}
<meta name="twitter:description" content="{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}" />
{% else %}
<meta name="twitter:description" content="AI 에이전트와 자동화 시스템을 설계합니다. 1인 기업이 AI 팀과 협업하는 워크플로를 실험하고 기록합니다." />
{% endif %}
<meta name="twitter:image" content="{% if page.header.image %}{{ page.header.image | absolute_url }}{% elsif page.header.teaser %}{{ page.header.teaser | absolute_url }}{% else %}https://github.com/ChloePark85.png{% endif %}" />

<!-- Canonical URL -->
<link rel="canonical" href="{{ page.url | absolute_url }}" />

<!-- Structured Data (JSON-LD) -->
{% include structured-data.html %}

<!-- Korean font -->
<link
  rel="stylesheet"
  as="style"
  crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
/>
<style>
  :root {
    --korean-sans: "Pretendard Variable", Pretendard, -apple-system,
      BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic",
      sans-serif;

    --chloe-ink:        #0f172a;
    --chloe-ink-soft:   #1f2937;
    --chloe-muted:      #64748b;
    --chloe-line:       #e5e7eb;
    --chloe-bg:         #ffffff;
    --chloe-bg-soft:    #f7f7fb;
    --chloe-accent:     #6366f1;
    --chloe-accent-2:   #8b5cf6;
    --chloe-accent-ink: #4f46e5;
  }

  body,
  .page__title,
  .page__lead,
  .archive__item-title,
  .archive__item-excerpt,
  .sidebar,
  .greedy-nav,
  .masthead,
  h1, h2, h3, h4, h5, h6,
  p, li, a, blockquote {
    font-family: var(--korean-sans) !important;
  }

  .page__title,
  .page__lead,
  .page__hero-caption,
  .page__hero--overlay .page__title,
  .page__hero--overlay .page__lead,
  .archive__item-title,
  .archive__item-excerpt,
  .masthead__menu-item a,
  h1, h2, h3, h4, h5, h6 {
    text-shadow: none !important;
  }

  .page__content p,
  .page__content li { line-height: 1.75; }

  .author__bio { line-height: 1.5; }

  /* ── Splash home: full-bleed canvas ─────────────────────────── */
  .layout--splash #main {
    max-width: 100%;
    padding: 0;
  }
  .layout--splash .page__content { padding: 0; }
  .layout--splash .page__content > .chloe-home > .chloe-hero:first-child {
    margin-top: 0;
  }

  /* ── Shared ───────────────────────────────────────────────────── */
  .chloe-home {
    color: var(--chloe-ink);
    font-family: var(--korean-sans);
  }
  .chloe-home a { text-decoration: none; }

  .chloe-eyebrow {
    display: inline-block;
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--chloe-accent-ink);
    background: rgba(99, 102, 241, 0.09);
    padding: 6px 12px;
    border-radius: 999px;
  }
  .chloe-accent {
    background: linear-gradient(120deg, var(--chloe-accent) 0%, var(--chloe-accent-2) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* ── Hero ─────────────────────────────────────────────────────── */
  .chloe-hero {
    position: relative;
    padding: 96px 24px 80px;
    background:
      radial-gradient(1200px 500px at 85% -10%, rgba(139,92,246,0.18), transparent 60%),
      radial-gradient(900px 500px at -10% 20%, rgba(99,102,241,0.14), transparent 60%),
      linear-gradient(180deg, #fafaff 0%, #ffffff 100%);
    overflow: hidden;
  }
  .chloe-hero__inner {
    max-width: 1120px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 72px;
    align-items: center;
  }
  .chloe-hero__intro { min-width: 0; }
  .chloe-hero__title {
    margin: 18px 0 20px !important;
    font-size: clamp(2.2rem, 4.6vw, 3.4rem);
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: -0.02em;
    color: var(--chloe-ink);
  }
  .chloe-hero__lead {
    margin: 0 0 32px;
    font-size: 1.08rem;
    line-height: 1.75;
    color: var(--chloe-ink-soft);
  }
  .chloe-hero__actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }
  .chloe-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.98rem;
    transition: transform 0.15s ease, box-shadow 0.15s ease,
                background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    border: 1px solid transparent;
  }
  .chloe-btn--primary {
    background: linear-gradient(120deg, var(--chloe-accent) 0%, var(--chloe-accent-2) 100%);
    color: #fff !important;
    box-shadow: 0 10px 22px -8px rgba(99, 102, 241, 0.55);
  }
  .chloe-btn--primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 26px -8px rgba(99, 102, 241, 0.6);
  }
  .chloe-btn--ghost {
    color: var(--chloe-ink) !important;
    border-color: var(--chloe-line);
    background: #fff;
  }
  .chloe-btn--ghost:hover {
    border-color: var(--chloe-accent);
    color: var(--chloe-accent-ink) !important;
    transform: translateY(-2px);
  }

  .chloe-hero__meta {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    margin: 8px 0 0;
    padding: 0;
    list-style: none;
    color: var(--chloe-muted);
    font-size: 0.92rem;
  }
  .chloe-hero__meta li { display: inline-flex; align-items: center; gap: 6px; }
  .chloe-hero__meta i { color: var(--chloe-accent); }

  .chloe-hero__portrait {
    position: relative;
    justify-self: center;
    width: min(360px, 100%);
    aspect-ratio: 1;
  }
  .chloe-hero__glow {
    position: absolute;
    inset: -10%;
    background:
      radial-gradient(closest-side, rgba(139,92,246,0.35), transparent 70%),
      radial-gradient(closest-side at 30% 70%, rgba(99,102,241,0.35), transparent 70%);
    filter: blur(6px);
    z-index: 0;
    border-radius: 50%;
    animation: chloe-pulse 6s ease-in-out infinite;
  }
  @keyframes chloe-pulse {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    50%      { transform: scale(1.05); opacity: 1; }
  }
  .chloe-hero__avatar {
    position: absolute;
    inset: 8%;
    z-index: 1;
    border-radius: 50%;
    overflow: hidden;
    background: #fff;
    box-shadow:
      0 24px 48px -12px rgba(15, 23, 42, 0.22),
      0 0 0 8px #fff,
      0 0 0 9px rgba(99, 102, 241, 0.18);
  }
  .chloe-hero__avatar img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .chloe-hero__chip {
    position: absolute;
    z-index: 2;
    padding: 8px 14px;
    background: #fff;
    border-radius: 999px;
    font-size: 0.86rem;
    font-weight: 600;
    color: var(--chloe-ink);
    box-shadow: 0 10px 24px -8px rgba(15, 23, 42, 0.15),
                0 0 0 1px rgba(15, 23, 42, 0.05);
    white-space: nowrap;
    animation: chloe-float 5s ease-in-out infinite;
  }
  .chloe-hero__chip--1 { top: 6%; left: -6%;  animation-delay: -1s; }
  .chloe-hero__chip--2 { bottom: 14%; right: -8%; animation-delay: -3s; }
  .chloe-hero__chip--3 { bottom: -2%; left: 8%;  animation-delay: -5s; }
  @keyframes chloe-float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }

  /* ── Sections ─────────────────────────────────────────────────── */
  .chloe-section {
    padding: 96px 24px;
    background: var(--chloe-bg);
  }
  .chloe-section--muted { background: var(--chloe-bg-soft); }
  .chloe-section--cta   { padding: 80px 24px; }

  .chloe-section__head {
    max-width: 1120px;
    margin: 0 auto 48px;
    text-align: center;
  }
  .chloe-section__title {
    margin: 12px 0 8px !important;
    font-size: clamp(1.6rem, 3vw, 2.1rem);
    font-weight: 800;
    letter-spacing: -0.01em;
    color: var(--chloe-ink);
  }
  .chloe-section__sub {
    margin: 0;
    color: var(--chloe-muted);
    font-size: 1rem;
  }
  .chloe-section__sub a {
    color: var(--chloe-accent-ink);
    font-weight: 600;
  }
  .chloe-section__sub a:hover { text-decoration: underline; }

  /* ── Books ────────────────────────────────────────────────────── */
  .chloe-book-grid {
    max-width: 1120px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 36px;
  }
  .chloe-book { display: flex; flex-direction: column; }
  .chloe-book__cover {
    position: relative;
    display: block;
    aspect-ratio: 3 / 4;
    padding: 0;
    border-radius: 6px 14px 14px 6px;
    background: #fff;
    text-decoration: none;
    box-shadow:
      -8px 8px 0 rgba(15, 23, 42, 0.04),
      0 24px 32px -16px rgba(15, 23, 42, 0.28);
    overflow: hidden;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .chloe-book__cover:hover {
    transform: translateY(-4px);
    box-shadow:
      -8px 8px 0 rgba(15, 23, 42, 0.06),
      0 28px 40px -16px rgba(15, 23, 42, 0.35);
  }
  .chloe-book__cover::before {
    display: none;
  }
  .chloe-book__cover::after {
    display: none;
  }
  .chloe-book__cover--indigo {
    background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
  }
  .chloe-book__cover--violet {
    background: linear-gradient(135deg, #7c3aed 0%, #ec4899 100%);
  }
  .chloe-book__cover--rose {
    background: linear-gradient(135deg, #f97316 0%, #db2777 100%);
  }
  .chloe-book__label {
    position: absolute;
    top: 18px;
    right: 18px;
    padding: 4px 10px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    background: rgba(79, 70, 229, 0.92);
    color: #fff;
    border-radius: 999px;
    box-shadow: 0 6px 16px -6px rgba(15, 23, 42, 0.45);
    z-index: 1;
  }
  .chloe-book__image {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #fff;
  }
  .chloe-book__title {
    font-size: 1.35rem;
    font-weight: 800;
    line-height: 1.3;
    margin-bottom: 12px;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.18);
  }
  .chloe-book__author {
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    opacity: 0.85;
    text-transform: uppercase;
  }
  .chloe-book__meta {
    margin-top: 20px;
    font-size: 0.86rem;
    color: var(--chloe-muted);
    letter-spacing: 0.02em;
  }
  .chloe-book__desc {
    margin: 10px 0 14px;
    font-size: 0.97rem;
    color: var(--chloe-ink-soft);
    line-height: 1.65;
  }
  .chloe-book__link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
    font-size: 0.94rem;
    color: var(--chloe-accent-ink) !important;
    align-self: flex-start;
    transition: gap 0.15s ease, color 0.15s ease;
  }
  .chloe-book__link:hover {
    gap: 10px;
    color: var(--chloe-accent-2) !important;
  }

  /* ── Projects ─────────────────────────────────────────────────── */
  .chloe-project-grid {
    max-width: 1120px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }
  .chloe-project {
    display: block;
    padding: 28px 26px;
    background: #fff;
    border: 1px solid var(--chloe-line);
    border-radius: 16px;
    color: var(--chloe-ink) !important;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .chloe-project:hover {
    transform: translateY(-4px);
    border-color: rgba(99, 102, 241, 0.35);
    box-shadow: 0 20px 40px -18px rgba(15, 23, 42, 0.15);
  }
  .chloe-project__icon {
    font-size: 1.9rem;
    margin-bottom: 14px;
  }
  .chloe-project__title {
    margin: 0 0 8px !important;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--chloe-ink);
    font-family: "SFMono-Regular", ui-monospace, Menlo, monospace;
    letter-spacing: -0.01em;
  }
  .chloe-project__desc {
    margin: 0 0 16px;
    font-size: 0.95rem;
    line-height: 1.65;
    color: var(--chloe-ink-soft);
  }
  .chloe-project__tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chloe-project__tags span {
    padding: 4px 10px;
    font-size: 0.76rem;
    font-weight: 600;
    color: var(--chloe-accent-ink);
    background: rgba(99, 102, 241, 0.09);
    border-radius: 999px;
  }

  /* ── CTA / Channels ───────────────────────────────────────────── */
  .chloe-section--cta {
    background:
      radial-gradient(700px 300px at 50% 0%, rgba(139,92,246,0.14), transparent 70%),
      var(--chloe-bg);
  }
  .chloe-cta {
    max-width: 1120px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    align-items: center;
    padding: 40px;
    background: #fff;
    border: 1px solid var(--chloe-line);
    border-radius: 20px;
    box-shadow: 0 30px 60px -30px rgba(15, 23, 42, 0.18);
  }
  .chloe-cta .chloe-section__title { margin-top: 8px !important; }
  .chloe-channels {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
  }
  .chloe-channel {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 18px;
    border: 1px solid var(--chloe-line);
    border-radius: 12px;
    color: var(--chloe-ink) !important;
    font-weight: 600;
    transition: transform 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .chloe-channel i {
    width: 24px;
    text-align: center;
    color: var(--chloe-accent);
    font-size: 1.1rem;
  }
  .chloe-channel:hover {
    transform: translateY(-2px);
    border-color: var(--chloe-accent);
    color: var(--chloe-accent-ink) !important;
  }

  /* ── Responsive ───────────────────────────────────────────────── */
  @media (max-width: 900px) {
    .chloe-hero { padding: 72px 20px 56px; }
    .chloe-hero__inner {
      grid-template-columns: 1fr;
      gap: 48px;
      text-align: center;
    }
    .chloe-hero__meta { justify-content: center; }
    .chloe-hero__actions { justify-content: center; }
    .chloe-hero__portrait {
      width: min(280px, 78%);
      margin: 0 auto;
    }

    .chloe-section  { padding: 72px 20px; }

    .chloe-book-grid,
    .chloe-project-grid { grid-template-columns: 1fr; gap: 32px; }

    .chloe-cta {
      grid-template-columns: 1fr;
      padding: 32px 24px;
      text-align: center;
    }
  }

  @media (max-width: 560px) {
    .chloe-hero__chip { font-size: 0.78rem; padding: 6px 12px; }
    .chloe-hero__chip--1 { left: -2%; }
    .chloe-hero__chip--2 { right: -2%; }
    .chloe-channels { grid-template-columns: 1fr; }
  }

  /* ── Sub-page hero variants ───────────────────────────────────── */
  .chloe-hero--compact { padding: 72px 24px 56px; }
  .chloe-hero--center  { text-align: center; }
  .chloe-hero--center .chloe-hero__lead { max-width: 640px; margin-left: auto; margin-right: auto; }
  .chloe-hero--center .chloe-hero__actions { justify-content: center; }

  .chloe-hero__inner--single {
    display: block;
    max-width: 820px;
  }
  .chloe-hero__portrait--sm { width: min(240px, 100%); }

  /* ── Facts / Education ────────────────────────────────────────── */
  .chloe-facts {
    max-width: 1120px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }
  .chloe-fact {
    padding: 26px 24px;
    background: #fff;
    border: 1px solid var(--chloe-line);
    border-radius: 16px;
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .chloe-fact:hover {
    transform: translateY(-3px);
    border-color: rgba(99, 102, 241, 0.35);
    box-shadow: 0 20px 40px -18px rgba(15, 23, 42, 0.15);
  }
  .chloe-fact__year {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--chloe-accent-ink);
    background: rgba(99, 102, 241, 0.09);
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 14px;
  }
  .chloe-fact__title {
    font-size: 1.08rem;
    font-weight: 700;
    color: var(--chloe-ink);
    margin-bottom: 6px;
  }
  .chloe-fact__desc {
    font-size: 0.92rem;
    color: var(--chloe-muted);
    line-height: 1.6;
  }

  /* ── Publications ────────────────────────────────────────────── */
  .chloe-publications {
    max-width: 920px;
    margin: 0 auto;
    padding: 0;
    list-style: none;
    border-top: 1px solid var(--chloe-line);
  }
  .chloe-publication {
    display: grid;
    grid-template-columns: 72px minmax(0, 1fr);
    gap: 24px;
    padding: 24px 0;
    border-bottom: 1px solid var(--chloe-line);
  }
  .chloe-publication__year {
    padding-top: 3px;
    color: var(--chloe-accent-ink);
    font-size: 0.82rem;
    font-weight: 800;
    letter-spacing: 0.08em;
  }
  .chloe-publication__title {
    color: var(--chloe-ink) !important;
    font-size: 1.02rem;
    font-weight: 700;
    line-height: 1.55;
  }
  .chloe-publication__title:hover { color: var(--chloe-accent-ink) !important; }
  .chloe-publication__title span {
    color: var(--chloe-accent);
    font-size: 0.82em;
  }
  .chloe-publication__authors,
  .chloe-publication__venue {
    margin-top: 5px;
    color: var(--chloe-muted);
    font-size: 0.88rem;
    line-height: 1.55;
  }
  .chloe-publication__venue { color: var(--chloe-ink-soft); }

  /* ── Contact cards ────────────────────────────────────────────── */
  .chloe-contact-grid {
    max-width: 1120px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
  }
  .chloe-contact-card {
    display: block;
    padding: 28px 26px;
    background: #fff;
    border: 1px solid var(--chloe-line);
    border-radius: 16px;
    color: var(--chloe-ink) !important;
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .chloe-contact-card:hover {
    transform: translateY(-4px);
    border-color: rgba(99, 102, 241, 0.35);
    box-shadow: 0 20px 40px -18px rgba(15, 23, 42, 0.15);
  }
  .chloe-contact-card__icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 12px;
