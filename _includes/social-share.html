<aside class="chloe-newsletter chloe-newsletter--form">
  <div class="chloe-newsletter__text">
    <strong>📮 새 글을 메일로 받아보세요</strong>
    <span>AI 자동화 실험 노트를 뉴스레터로 보내드려요.</span>
  </div>
  <div id="stb_subscribe">
    <form action="https://stibee.com/api/v1.0/lists/7v1kcOdh-ZlehsKJUAzeONp0kEfcjw==/public/subscribers" method="POST" target="_blank" accept-charset="utf-8" class="stb_form" name="stb_subscribe_form" id="stb_subscribe_form" data-lang="" novalidate>
      <fieldset class="stb_form_set">
        <label for="stb_email" class="stb_form_set_label">이메일 주소<span class="stb_asterisk">*</span></label>
        <div class="chloe-newsletter__row">
          <input type="text" class="stb_form_set_input" id="stb_email" name="email" required="required" placeholder="you@example.com">
          <fieldset class="stb_form_set_submit">
            <button type="submit" class="stb_form_submit_button" id="stb_form_submit_button" style="background-color: #6366f1; color: #ffffff;">구독하기</button>
          </fieldset>
        </div>
        <div class="stb_form_msg_error" id="stb_email_error"></div>
      </fieldset>
      <div class="stb_form_policy">
        <label>
          <input type="checkbox" id="stb_policy" value="stb_policy_true">
          <span>(필수)</span>
          <button id="stb_form_modal_open" data-modal="stb_form_policy_modal" class="stb_form_modal_open_btn" type="button">개인정보 수집 및 이용</button>에 동의합니다.
        </label>
        <div class="stb_form_msg_error" id="stb_policy_error"></div>
        <div class="stb_form_modal stb_form_policy_text blind" id="stb_form_policy_modal">
          <div class="stb_form_modal_body">
            <h1 class="stb_form_modal_title">개인정보 수집 및 이용</h1>
            <div class="stb_form_modal_text">뉴스레터 발송을 위한 최소한의 개인정보를 수집하고 이용합니다.
수집된 정보는 발송 외 다른 목적으로 이용되지 않으며, 서비스가 종료되거나 구독을 해지할 경우 즉시 파기됩니다.</div>
            <div class="stb_form_modal_btn">
              <button id="stb_form_modal_close" class="stb_form_modal_close_btn" data-modal="stb_form_policy_modal" type="button">닫기</button>
            </div>
          </div>
          <div class="stb_form_modal_bg" id="stb_form_modal_bg"></div>
        </div>
      </div>
      <div class="stb_form_result" id="stb_form_result"></div>
    </form>
  </div>
  <script type="text/javascript" src="https://resource.stibee.com/subscribe/stb_subscribe_form.js"></script>
</aside>

<section class="page__share">
  <h4 class="page__share-title">{{ site.data.ui-text[site.locale].share_on_label | default: "Share on" }}</h4>

  <button type="button" class="btn btn--primary" aria-label="링크 복사" title="링크 복사"
    onclick="(function(b){var u='{{ page.url | absolute_url }}';function done(ok){var s=b.querySelector('span');var t=s.textContent;s.textContent=ok?' 복사됨!':' 복사 실패';setTimeout(function(){s.textContent=t;},1500);}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(u).then(function(){done(true);},function(){done(false);});}else{var i=document.createElement('input');i.value=u;document.body.appendChild(i);i.select();try{done(document.execCommand('copy'));}catch(e){done(false);}document.body.removeChild(i);}})(this); return false;">
    <i class="fas fa-fw fa-link" aria-hidden="true"></i><span> 링크 복사</span>
  </button>

  <a href="https://x.com/intent/tweet?{% if site.twitter.username %}via={{ site.twitter.username | url_encode }}&{% endif %}text={{ page.title | url_encode }}%20{{ page.url | absolute_url | url_encode }}" class="btn btn--x" aria-label="Share on X" onclick="window.open(this.href, 'window', 'left=20,top=20,width=500,height=500,toolbar=1,resizable=0'); return false;" title="{{ site.data.ui-text[site.locale].share_on_label | default: 'Share on' }} X">
    <i class="fab fa-fw fa-x-twitter" aria-hidden="true"></i><span> X</span>
  </a>

  <a href="https://www.facebook.com/sharer/sharer.php?u={{ page.url | absolute_url | url_encode }}" class="btn btn--facebook" aria-label="Share on Facebook" onclick="window.open(this.href, 'window', 'left=20,top=20,width=500,height=500,toolbar=1,resizable=0'); return false;" title="{{ site.data.ui-text[site.locale].share_on_label | default: 'Share on' }} Facebook">
    <i class="fab fa-fw fa-facebook" aria-hidden="true"></i><span> Facebook</span>
  </a>

  <a href="https://www.linkedin.com/shareArticle?mini=true&url={{ page.url | absolute_url }}" class="btn btn--linkedin" aria-label="Share on LinkedIn" onclick="window.open(this.href, 'window', 'left=20,top=20,width=500,height=500,toolbar=1,resizable=0'); return false;" title="{{ site.data.ui-text[site.locale].share_on_label | default: 'Share on' }} LinkedIn">
    <i class="fab fa-fw fa-linkedin" aria-hidden="true"></i><span> LinkedIn</span>
  </a>

  <a href="https://bsky.app/intent/compose?text={{ page.title | url_encode }}%20{{ page.url | absolute_url | url_encode }}" class="btn btn--bluesky" onclick="window.open(this.href, 'window', 'left=20,top=20,width=500,height=500,toolbar=1,resizable=0'); return false;" title="{{ site.data.ui-text[site.locale].share_on_label | default: 'Share on' }} Bluesky">
    <i class="fab fa-fw fa-bluesky" aria-hidden="true"></i><span> Bluesky</span>
  </a>
</section>
